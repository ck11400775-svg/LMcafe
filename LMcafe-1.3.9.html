<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
let currentScreen = 'L0';
let soundDialogOrigin = 'L0';
let gameHasStarted = false;
// ============================================================
// 唯一實際鐘、唯一遊戲鐘與唯一判斷流程
// ============================================================
let timestop = true;
let gameFrame = 0;
const FRAME_MS = 100;
const UniqueRealClock = Object.freeze({
  getTime: () => Date.now()
});
// ============================================================
// 唯一排程區
// 所有 setTimeout / setInterval 與遊戲時間排程只在此區管理。
// ============================================================
const ScheduleSystem = (() => {
  const realTasks = new Set();
  const gameTasks = new Set();
  let frameTrigger = null;
  function armRealTask(task) {
    if (!task.active) return;
    task.timerId = window.setTimeout(() => {
      if (!task.active) return;
      const now = UniqueRealClock.getTime();
      if (now < task.dueAt) return armRealTask(task);
      if (task.interval > 0) task.dueAt = now + task.interval;
      else cancelReal(task);
      task.callback();
      if (task.active && task.interval > 0) armRealTask(task);
    }, Math.max(0, task.dueAt - UniqueRealClock.getTime()));
  }
  function scheduleReal(callback, delayMs = 0, intervalMs = 0) {
    if (typeof callback !== 'function') throw new TypeError('時間排程回呼必須是函式');
    const task = {
      callback,
      dueAt: UniqueRealClock.getTime() + Math.max(0, Number(delayMs) || 0),
      interval: Math.max(0, Number(intervalMs) || 0),
      active: true,
      timerId: null
    };
    realTasks.add(task);
    armRealTask(task);
    return task;
  }
  function cancelReal(task) {
    if (!task || !realTasks.has(task)) return false;
    task.active = false;
    if (task.timerId !== null) window.clearTimeout(task.timerId);
    task.timerId = null;
    realTasks.delete(task);
    return true;
  }
  const delayReal = delayMs => new Promise(resolve => scheduleReal(resolve, delayMs));
  function scheduleGameFrames(delayFrames, callback) {
    if (!Number.isInteger(delayFrames) || delayFrames < 0) throw new TypeError('排程延遲必須是非負 Frame 整數');
    if (typeof callback !== 'function') throw new TypeError('排程回呼必須是函式');

function chooseCustomerCup() {
  const entries = CUP_IDS.map(size => {
    const unlock=LevelSystem.required('cup',size);
    return {size,weight:LevelSystem.isUnlocked('cup',size)?CUP_WEIGHT_FACTOR[size]*(state.level-unlock+1):0};
  }).filter(x => x.weight > 0);
  const total = entries.reduce((sum, item) => sum + item.weight, 0);
  if (total <= 0) return 'CUP-0';
  let roll = Math.random() * total;
  for (const item of entries) {
    roll -= item.weight;
    if (roll < 0) return item.size;
  }
  return entries[entries.length - 1].size;
}

}

  state.customers=state.customers.filter(customer=>{

function tickIndoorMeal(customerId){
  const customer=findCustomer(customerId,'indoor');
  if(!customer||customer.status!=='eating')return;
  const elapsed=Math.max(0,TimeSystem.getGameFrame()-customer.mealStartedFrame);
  const elapsedPenalty=integerize(elapsed/50,'floor'),recorded=Number(customer.mealPenaltyTicks)||0;
  if(elapsedPenalty>recorded){state.shortRep-=elapsedPenalty-recorded;customer.mealPenaltyTicks=elapsedPenalty;}

function getCustomerCoffeePlan(customer, beanGrade, milkType, sourceState=state) {
  beanGrade=beanId(beanGrade)||beanGrade;
  if(!customer || customer.status!=='waiting') return {error:'這位顧客已不存在或不再等待製作。',missingMaterials:[]};
  const channel=customer.channel, isIndoor=channel==='indoor', isMilk=customer.kind==='milk';
  if(!['takeout','indoor'].includes(channel)) return {error:'顧客類型無效。',missingMaterials:[]};
  if(isMilk && !LevelSystem.isUnlocked('milk')) return {error:'牛奶咖啡需 LV5 解鎖。',missingMaterials:[]};
  if(!BEANS.includes(beanGrade) || !LevelSystem.isUnlocked('bean',beanGrade)) return {error:'咖啡豆等級尚未解鎖。',missingMaterials:[]};
  let beansNeeded,energyNeeded,gainedEP,earned,milkItem=null,cupSize=null;
  if(isMilk){
    milkItem=MILK_INFO[milkType];
    if(!milkItem) return {error:'牛奶原料選擇無效。',missingMaterials:[]};
    beansNeeded=15;energyNeeded=1;gainedEP=16;
    earned=integerize(55*(isIndoor?1+(Number(sourceState.serviceFee)||0)/100:1));
  }else{
    const size=customer.size;
    if(!(size in CUP_COST)) return {error:'杯型無效。',missingMaterials:[]};
    if(!LevelSystem.isUnlocked('cup',size)) return {error:`${CUP_LABEL[size]}需 LV${LevelSystem.required('cup',size)} 解鎖。`,missingMaterials:[]};
    const recipe=COFFEE_RECIPE[size];beansNeeded=recipe.beans;energyNeeded=recipe.energy;gainedEP=recipe.ep;
    earned=integerize(price(size)*(isIndoor?1+(Number(sourceState.serviceFee)||0)/100:1));
  }
  if(!isIndoor)cupSize=isMilk?'CUP-0':customer.size;
  const missingMaterials=[];
  if((sourceState.beans[beanGrade]||0)<beansNeeded)missingMaterials.push((BEAN_GRADE[beanGrade]||'所選')+'級咖啡豆');
  if(isMilk&&(sourceState.milkStock[milkType]||0)<milkItem.use)missingMaterials.push(milkItem.label);
  if(!isIndoor&&(sourceState.cups[cupSize]||0)<1)missingMaterials.push(CUP_LABEL[cupSize]+'外帶杯');
  if(isMilk&&(sourceState.milkStock[milkType]||0)<milkItem.use) return {error:`${milkItem.label}庫存不足。`,missingMaterials};
  if(!sourceState.energyInfinite && sourceState.energy<energyNeeded) return {error:'活力不足。',missingMaterials};
  if((sourceState.beans[beanGrade]||0)<beansNeeded) return {error:`${BEAN_GRADE[beanGrade]} 級豆不足。`,missingMaterials};
  if(!isIndoor&&(sourceState.cups[cupSize]||0)<1) return {error:`${CUP_LABEL[cupSize]}外帶杯不足。`,missingMaterials};
  return {channel,isIndoor,isMilk,beanGrade,beansNeeded,energyNeeded,gainedEP,earned,milkItem,cupSize,milkType,missingMaterials};
}
function makeCustomerCoffee(customerId, beanGrade=state.selectedBean, milkType=state.selectedMilk, silent=false) {
  const customer=findCustomer(customerId);
  const plan=getCustomerCoffeePlan(customer,beanGrade,milkType);
  if(plan.error) { if(!silent) notify(plan.error,customer?.channel==='indoor'?'indoor':'takeout'); return false; }
  const {channel,isIndoor,isMilk,beansNeeded,energyNeeded,gainedEP,earned,milkItem,cupSize}=plan;
  const oldLevel=state.level;
  state.beans[plan.beanGrade]-=beansNeeded;
  if(milkItem) state.milkStock[milkType]-=milkItem.use;
  if(cupSize) state.cups[cupSize]--;
  if(!state.energyInfinite) state.energy-=energyNeeded;
  cancelRobotJobsForCustomer(channel,customerId);
  state.money+=earned;state.income+=earned;state.ep+=gainedEP;
  applyCompletedCustomerReputation(isMilk?null:customer.size,plan.beanGrade);
  if(isIndoor){
    customer.serviceFeeCharged=Number(state.serviceFee)||0;
    customer.status='eating';
    const maxMealFrames=Math.max(50,Math.min(120,Number(state.mealLimit)||30)*10);customer.mealDurationFrames=50+integerize(Math.random()*Math.max(1,maxMealFrames-50),'floor');
    customer.mealPenaltyTicks=0;customer.mealStartedFrame=TimeSystem.getGameFrame();
    ScheduleSystem.scheduleGameFrames(1,()=>tickIndoorMeal(customer.id));
  }else{
    state.customers=state.customers.filter(item=>item!==customer);
  }
  const product=isMilk?'牛奶咖啡':`${CUP_LABEL[customer.size]}咖啡`;
  if(!silent) record(`完成${isIndoor?'內用':''}顧客 #${customerId} 的${product}需求，收入 ${moneyText(earned)} LT，獲得 ${gainedEP} EP。`);
  updateLevel(oldLevel,true,silent);VisualSystem.dispatch('game');
  if(!state.energyInfinite && state.energy===0) advanceDay();
}
function makeCoffee(size, customerId, beanGrade) {
  const customer=findCustomer(customerId,'takeout',true);

function buyRobot(){
  if(!LevelSystem.isUnlocked('robot'))return notify(`機器人需 LV${LevelSystem.required('robot')} 解鎖。`);
  purchase(ROBOT_BASE_COST,'基礎機器人',()=>{
    if(!Array.isArray(state.robotEmployees))state.robotEmployees=[];
    const id=window.LMcafeAPI['02']['ID 建立/建立新 ID']('BOT');
    window.LMcafeAPI['02']['ID 登記/登記 ID'](id);
    state.robotEmployees.push({id,job:null});
  });
  VisualSystem.dispatch('robotManagement');
  ensureRobotWorkScheduled();

function listEligibleRobotCustomers(){
  const candidates=[];
  for(const customer of state.customers){
    if(customer.status!=='waiting'||state.robotEmployees.some(robot=>robot.job?.customerId===customer.id&&robot.job?.type===customer.channel))continue;
    if(!LevelSystem.isUnlocked('robot'))continue;
    const plan=getCustomerCoffeePlan(customer,state.selectedBean,state.selectedMilk);
    if(!plan.error)candidates.push({type:customer.channel,id:customer.id,target:customer,choice:{beanGrade:plan.beanGrade,milkType:state.selectedMilk,complexity:plan.isMilk?1.5:1},arrivedFrame:Number(customer.arrivedFrame)||0,createdSeq:Number(customer.createdSeq)||Number(customer.id)||0});
  }
  candidates.sort((a,b)=>a.arrivedFrame-b.arrivedFrame || a.createdSeq-b.createdSeq);
  return candidates;
}
function assignIdleRobots(){
  if(!LevelSystem.isUnlocked('robot') || !state.robotEmployees.length) return false;
  let changed=false;
  const robots=[...state.robotEmployees].sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true}));
  const candidates=listEligibleRobotCustomers();
  for(const robot of robots){
    if(robot.job) continue;
    const next=candidates.shift();
    if(!next) break;
    const durationFrames=integerize(next.choice.complexity*40,'ceil');
    robot.job={type:next.type,customerId:next.id,beanGrade:next.choice.beanGrade,milkType:next.choice.milkType,remainingFrames:durationFrames};
    changed=true;
  }
  return changed;
}
function cancelRobotJobsForCustomer(type,id){
  for(const robot of state.robotEmployees){
    if(robot.job && robot.job.type===type && robot.job.customerId===id) robot.job=null;
  }
}
let robotWorkTask=null;
function ensureRobotWorkScheduled(){
  if(robotWorkTask||!state.robotEmployees.length)return false;
  const active=state.robotEmployees.some(robot=>!!robot.job)||state.customers.some(customer=>customer.status==='waiting');
  if(!active)return false;
  robotWorkTask=ScheduleSystem.scheduleGameFrames(1,tickRobotWork);
  return true;
}
function tickRobotWork(){
  robotWorkTask=null;
  const robots=state.robotEmployees;
  if(!robots.length)return;
  let changed=false;
  for(const robot of robots){
    const job=robot.job;
    if(!job)continue;
    const target=findCustomer(job.customerId,job.type,true);
    if(!target){robot.job=null;changed=true;continue;}
    job.remainingFrames=Math.max(0,(Number(job.remainingFrames)||0)-1);
    if(job.remainingFrames>0)continue;
    robot.job=null;
    makeCustomerCoffee(target.id,job.beanGrade,job.milkType,true);
    changed=true;
  }
  if(assignIdleRobots())changed=true;
  if(changed)VisualSystem.dispatch('robotManagement');
  VisualSystem.dispatch('robotCountdowns');
  ensureRobotWorkScheduled();
}

function advanceDay() {
  if (timestop) return;
  if (changingDay) return;
  changingDay = true;
  const finishedDay = state.day;
  const income = state.income;
  const spend = state.spend;
  processElectricity();
  state.day++;
  rollOrdinaryWeather();
  eventId=0;
  state.discount = 1;
  state.d1Choice = null;
  if (!state.energyInfinite) state.energy = state.maxEnergy;
  state.income = 0;
  state.spend = 0;
  record(`結算：收入 ${moneyText(income)} LT、支出 ${moneyText(spend)} LT、淨額 ${moneyText(income-spend)} LT。`, finishedDay);
  notify(`進入 D${state.day}，活力已恢復，折扣已重置。`);
  if (state.day >= state.loanDue) {
    if (state.loanBalance > 0) {
      const interest = integerize(state.loanBalance * 0.05 + Number.EPSILON);
      const balanceWithInterest = state.loanBalance + interest;
      const rate = Math.max(1.5, Math.min(12.5, Number(state.loanRate) || 1.5)) / 100;
      const payment = Math.min(balanceWithInterest, Math.max(1, integerize(balanceWithInterest * rate + Number.EPSILON)));
      state.money -= payment;
      state.spend += payment;
      state.loanBalance = Math.max(0, balanceWithInterest - payment);
      record(`貸款本期計息 ${moneyText(interest)} LT（5%），按 ${(rate*100).toFixed(1)}% 收取 ${moneyText(payment,' LT')}；剩餘債務 ${moneyText(state.loanBalance,' LT')}。`);
      if (state.loanBalance <= 0) {
        state.loanBalance = 0;
        record('貸款已全部還清。');
        notify('貸款已全部還清。');
      }
    } else {
      record('貸款週期日（每 30 日）；目前沒有未償還貸款，未扣款。');
    }
    state.loanDue += 30;
  }
  if (finishedDay >= state.utilityDue) {
    const bill=Number(state.electricityPeriodCost)||0;
    state.money-=bill;
    state.spend+=bill;
    record(`電費帳單：本期 60 日總額 ${moneyText(bill)} LT，已扣款。`,finishedDay);
    notify(`60 日電費帳單已結算：${moneyText(bill)} LT。`);
    state.electricityPeriodCost=0;
    state.electricityPeriodUsage=0;
    state.utilityDue+=60;
  }
  activateDayEvent();
  VisualSystem.dispatch('game');
  changingDay = false;
}

function achievementDefinitions(sourceState=state){
  const list=[];
  ACHIEVEMENT_MONEY_TARGETS.forEach(value=>{
    const label=value>=100000000?`${value/100000000}億`:value>=10000?`${value/10000}萬`:moneyText(value);
    list.push({
    id:`wealth-${value}`,category:'wealth',icon:'◈',title:`財富累積・${label}`,
    description:`目前持有 LT 達到 ${moneyText(value)}`,target:value,current:Math.max(0,Number(sourceState.money)||0),unit:'LT'
    });
  });
  ACHIEVEMENT_REPUTATION.forEach((grade,index)=>list.push({
    id:`reputation-${grade}`,category:'reputation',icon:'♜',title:`長期風評・${grade}`,
    description:`長期風評提升至 ${grade}`,target:index+1,current:Math.max(0,ACHIEVEMENT_REPUTATION.indexOf(longRepGrade(sourceState.longRep))+1),unit:'級'
  }));
  const nextLevel=Math.max(1,Math.floor(Number(sourceState.level)||0)+1);
  for(let level=1;level<=nextLevel;level++)list.push({
    id:`level-${level}`,category:'level',icon:'⌃',title:`升級至 LV${level}`,
    description:`達到 LV${level}`,target:level,current:Math.max(0,Number(sourceState.level)||0),unit:'LV'
  });

}
function checkAchievementUnlocks(silent=false){
  const defs=achievementDefinitions();
  const unlocked=state.achievementUnlocked||(state.achievementUnlocked={});
  for(const category of ['wealth','reputation','level']){
    const items=defs.filter(item=>item.category===category);
    for(let i=0;i<items.length;i++){
      const item=items[i];
      if(i>0&&!unlocked[items[i-1].id])break;
      const met=item.current>=item.target;
      if(met&&!unlocked[item.id]){
        unlocked[item.id]=true;
        if(!silent) notify(`成就達成：${item.title}`);
      }
      if(!unlocked[item.id])break;
    }
  }

const DebugSystem = (() => {
  const help = 'all max · money N|max · gl N|max · lv N|max · ep N|max · day N|max · energy N|max|inf · bean 豆級 N|max · cup 杯型 N|max';
  function write(message) {

  }
  function setLevel(value) {
    const maxLevel = levelFor(INPUT_LIMITS.ep);
    if (!Number.isSafeInteger(value) || value < 0 || value > maxLevel) {
      write(`LV 數值無效，請輸入 0～${maxLevel} 的整數。`);

    return true;
  }
  function execute(command) {
    const parts = String(command ?? '').trim().split(/\s+/).filter(Boolean);
    const [action, key, rawValue, ...extra] = parts;
    if (action === 'help') { write(help); return; }
    if (action === 'all' && key === 'max' && parts.length === 2) {
      const oldLevel = state.level;
      state.money = INPUT_LIMITS.money;
      state.gl = INPUT_LIMITS.money;
      state.ep = INPUT_LIMITS.ep;
      updateLevel(oldLevel);
      state.energyInfinite = true;

      BEANS.forEach(grade => state.beans[grade] = INPUT_LIMITS.bean);
      Object.keys(state.cups).forEach(size => state.cups[size] = INPUT_LIMITS.cup);
      Object.keys(state.milkStock).forEach(type => state.milkStock[type] = INPUT_LIMITS.stock);
      state.indoorCups = INPUT_LIMITS.count;
      state.seats = INPUT_LIMITS.count;
      state.expansionCount = Math.max(1, Number(state.expansionCount)||0);
      state.serviceFee = 0;
      state.mealLimit = 5;
      state.customers.filter(customer=>customer.channel==='indoor').forEach(customer => {
        if (customer.status === 'eating') {
          customer.mealDurationFrames = 50;
          customer.mealStartedFrame = TimeSystem.getGameFrame();
        }
      });
      state.longRep = INPUT_LIMITS.money;
      state.shortRep = INPUT_LIMITS.money;
      state.income = INPUT_LIMITS.money;
      checkAchievementUnlocks();
      state.spend = 0;
      state.loanBalance = 0;
      state.loanRate = 1.5;
      state.loanDue = INPUT_LIMITS.day;
      write('All Max 已執行：有益資源與庫存已補滿；活力設為無限；風評與營運成果提升；用餐時間及支出降至有利值。日期、未實裝系統與未定規則未被擅自更動。');
      VisualSystem.dispatch('game');
      VisualSystem.dispatch('input.reset',{values:{serviceFee:'0',mealLimit:'5',smallPrice:'35'}});
      return;
    }
    const validShape = extra.length === 0 && (
      ['money','gl','lv','ep','day','energy'].includes(action) ? parts.length === 2 :
      ['bean','cup'].includes(action) ? parts.length === 3 : false
    );
    if (!validShape) { write(`指令格式錯誤。${help}`); return; }
    const raw = ['bean','cup'].includes(action) ? rawValue : key;
    if (action === 'lv') {
      const maxLevel = levelFor(INPUT_LIMITS.ep);
      const value = raw === 'max' ? maxLevel : Number(raw);
      setLevel(value);
      return;
    }
    let limit;
    if (action === 'money' || action === 'gl') limit = INPUT_LIMITS.money;
    else if (action === 'ep') limit = INPUT_LIMITS.ep;
    else if (action === 'day') limit = INPUT_LIMITS.day;
    else if (action === 'energy') limit = state.maxEnergy;
    else if (action === 'bean') {
      const id=beanId(key);
      if (!id) { write('豆級無效，請輸入 BEAN-0 至 BEAN-13（亦接受等級文字）。'); return; }
      limit = INPUT_LIMITS.bean;

      const id=cupId(key);
      if (!id) { write('杯型 ID 無效，請輸入 CUP-0、CUP-1、CUP-2 或 CUP-3。'); return; }
      limit = INPUT_LIMITS.cup;
    }
    const isInf = action === 'energy' && raw === 'inf';
    const isMax = raw === 'max';
    const number = isMax ? limit : Number(raw);
    if (!isInf && (raw === undefined || raw === '' || !Number.isFinite(number) || number < 0 || number > limit)) {
      write(`數值無效或超出安全範圍（0～${moneyText(limit)}）。輸入 help 查看指令。`);
      return;
    }
    if (['day','cup'].includes(action) && !Number.isSafeInteger(number)) {
      write(action === 'day' ? '營業日必須是整數。' : '杯數必須是整數。');
      return;
    }
    if (action === 'money') { state.money = number; checkAchievementUnlocks(); }
    else if (action === 'gl') state.gl = number;
    else if (action === 'ep') { const old = state.level; state.ep = number; updateLevel(old); }
    else if (action === 'day') { state.day = number; rollOrdinaryWeather(); eventId=0; state.discount = 1; state.d1Choice = null; activateDayEvent(); }
    else if (action === 'energy') {

    }

    else if (action === 'cup') state.cups[cupId(key)] = number;
    write(isInf ? '已啟用無限活力：製作不消耗活力，換日也會持續生效。輸入 energy N 或 energy max 可關閉。' :
      isMax ? `已設為安全上限：${moneyText(number)}。` : '指令已執行。');
    VisualSystem.dispatch('game');
  }
  return Object.freeze({execute, help});
})();

function loanCreditLimit(sourceState=state){return 10000*Math.pow(2,Math.max(0,Number(sourceState.level)||0));}
function setLoanRate(value){
  state.loanRate=Math.max(1.5,Math.min(12.5,Number(value)||1.5));
  VisualSystem.dispatch('loan');
}
function applyLoan(amount){
  const available=Math.max(0,loanCreditLimit()-(Number(state.loanBalance)||0));
  if(!Number.isFinite(amount)||!Number.isInteger(amount)||amount<1)return notify('請輸入正確的貸款金額。');
  if(amount>available)return notify(`申請金額超過可貸額度，目前最多可申請 ${moneyText(available,' LT')}。`);
  state.loanBalance+=amount;
  state.money+=amount;
  checkAchievementUnlocks();
  record(`申請貸款 ${moneyText(amount,' LT')}；目前未償債務 ${moneyText(state.loanBalance,' LT')}。`);
  notify(`貸款申請成功，取得 ${moneyText(amount,' LT')}。`);
  VisualSystem.dispatch('input.reset',{target:'loanAmountInput',value:'',touched:'1'});
  VisualSystem.dispatch('game');
  return true;
}

function getLoanDisplayData(sourceState=visualState){
  const max=loanCreditLimit(sourceState),balance=Math.max(0,Number(sourceState.loanBalance)||0),available=Math.max(0,max-balance);
  const rate=Math.max(1.5,Math.min(12.5,Number(sourceState.loanRate)||1.5));
  let estimate='尚無貸款',estimateHint='申請貸款後會顯示下一期預估收取金額。';
  if(balance>0){const withInterest=balance+integerize(balance*.05 + Number.EPSILON),payment=Math.min(withInterest,Math.max(1,integerize(withInterest*rate/100 + Number.EPSILON)));estimate=moneyText(payment,' LT');estimateHint=`以目前債務計算：計息後 ${moneyText(withInterest,' LT')}，本期比例 ${rate.toFixed(1)}%。`;}
  return {max,balance,available,hint:available>0?`目前 LV${sourceState.level} 可再申請 ${moneyText(available,' LT')}。`:'目前已用滿此等級可貸額度。',canApply:available>=1,rate,estimate,estimateHint};
}

      if (!ID_PREFIXES.includes(prefix)) {
        throw new TypeError("不支援的 ID 類別前綴");

      let serial = idCounters.get(prefix) ?? 0;
      let candidate = `${prefix}-${serial}`;

      }),

// 唯一音效與音樂區
// ============================================================
(function(){
 const KEY='lmcafe_audio_settings_v2';
 let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_error){}
 let musicVol=Number.isFinite(saved.musicVol)?saved.musicVol:.28;
 let sfxVol=Number.isFinite(saved.sfxVol)?saved.sfxVol:.45;
 let muted=saved.muted===undefined?false:!!saved.muted;
 let ctx=null,musicBus=null,sfxBus=null,loopTimer=null,step=0;
 const scale=[261.63,329.63,392,329.63,293.66,349.23,440,349.23,246.94,329.63,392,329.63,220,293.66,369.99,293.66];
 const bass=[130.81,146.83,123.47,110];
 const SOUND_PARAMETERS=Object.freeze({
  S01:Object.freeze({waveform:'triangle',startFrequency:220,endFrequency:165,duration:.150}),
  S02:Object.freeze({waveform:'sine',startFrequency:660,endFrequency:880,duration:.150}),
  S03:Object.freeze({waveform:'sine',startFrequency:660,endFrequency:440,duration:.300}),
  S04:Object.freeze({waveform:'sine',startFrequency:587.33,endFrequency:587.33,duration:.120})
 });
 const SAMPLE_RATE=44100,BASE_VOLUME=.18,FADE_IN=.005;
 function persist(){try{localStorage.setItem(KEY,JSON.stringify({musicVol,sfxVol,muted}))}catch(_error){}}
 function initializeAudio(){
  if(ctx)return ctx;
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return null;
  try{
   ctx=new AudioContextClass({sampleRate:SAMPLE_RATE});
   musicBus=ctx.createGain();sfxBus=ctx.createGain();
   musicBus.gain.value=muted?0:musicVol;sfxBus.gain.value=muted?0:sfxVol;
   musicBus.connect(ctx.destination);sfxBus.connect(ctx.destination);
   return ctx;
  }catch(_error){ctx=null;return null;}
 }
 function renderTone(duration,volume,bus,waveform,attackSamples,phaseAt,delay=0){
  if(!ctx||!bus)return false;
  const length=Math.max(1,integerize(SAMPLE_RATE*duration,'floor'));
  const buffer=ctx.createBuffer(1,length,SAMPLE_RATE),samples=buffer.getChannelData(0);
  const safeAttackSamples=Math.max(1,Number(attackSamples)||1);
  for(let i=0;i<length;i++){
   const phase=phaseAt(i,length);
   const wave=waveform==='triangle'?(2/Math.PI)*Math.asin(Math.sin(phase)):Math.sin(phase);
   const envelope=Math.min(1,i/safeAttackSamples)*Math.max(0,1-i/length);
   samples[i]=wave*volume*envelope;
  }
  const source=ctx.createBufferSource();source.buffer=buffer;source.connect(bus);source.start(ctx.currentTime+Math.max(0,delay));
  return true;
 }
 function musicStep(){
  if(!ctx||!musicBus)return;
  const n=step%scale.length;
  const fixedPhase=frequency=>(i)=>2*Math.PI*frequency*i/SAMPLE_RATE;
  renderTone(2.1,.055,musicBus,'sine',Math.max(1,integerize(SAMPLE_RATE*.35,'floor')),fixedPhase(scale[n]));
  if(n%2===0)renderTone(1.35,.012,musicBus,'triangle',Math.max(1,integerize(SAMPLE_RATE*.18,'floor')),fixedPhase(scale[n]*2),.08);
  if(n%4===0)renderTone(3.2,.026,musicBus,'sine',Math.max(1,integerize(SAMPLE_RATE*.5,'floor')),fixedPhase(bass[integerize(n/4,'floor')%4]),.12);
  if(n%4===2)renderTone(1.8,.009,musicBus,'sine',Math.max(1,integerize(SAMPLE_RATE*.4,'floor')),fixedPhase(scale[n]*1.5),.2);
  step++;
 }
 function startMusic(){if(loopTimer!==null||!ctx||ctx.state!=='running')return;musicStep();loopTimer=window.LMcafeScheduleSystem.scheduleReal(musicStep,1450,1450)}
 async function activate(){
  const context=initializeAudio();if(!context)return false;
  try{if(context.state==='suspended')await context.resume();}
  catch(_error){return false;}
  const running=context.state==='running';
  if(running)startMusic();
  return running;
 }
 async function play(soundId){
  const params=SOUND_PARAMETERS[soundId],context=initializeAudio();
  if(!context||!params||muted||sfxVol<=0)return false;
  if(context.state==='suspended'){try{await context.resume();}catch(_error){return false;}}
  if(context.state!=='running')return false;
  const phaseAt=(i,length)=>{
   const progress=i/length;
   return 2*Math.PI*(params.startFrequency*progress+(params.endFrequency-params.startFrequency)*progress*progress/2)*params.duration;
  };
  return renderTone(params.duration,BASE_VOLUME,sfxBus,params.waveform,Math.max(1,SAMPLE_RATE*FADE_IN),phaseAt);
 }
 function playButton(button){
  if(!button||button.disabled)return false;
  let soundId='S04';
  if(button.hasAttribute('data-computer-slot'))soundId=button.classList.contains('empty')?'S01':'S02';
  else if(['openPower','openControlComputer'].includes(button.id))soundId='S02';
  else if(button.dataset.interfaceBack!==undefined||button.dataset.interfaceHome!==undefined)soundId='S03';
  return play(soundId);
 }
 function setVolume(channel,value){
  const volume=Math.max(0,Math.min(1,(Number(value)||0)/100));
  if(channel==='music')musicVol=volume;
  else if(channel==='sfx')sfxVol=volume;
  else return false;
  sync();persist();return true;
 }
 const setMusicVolume=value=>setVolume('music',value);
 const setSfxVolume=value=>setVolume('sfx',value);
 function toggleMute(){muted=!muted;sync();persist();return muted;}
 function sync(){
  window.LMcafeVisualSystem.dispatch('audio.settings',{musicValue:integerize(musicVol*100,'round'),sfxValue:integerize(sfxVol*100,'round'),musicText:integerize(musicVol*100,'round')+'%',sfxText:integerize(sfxVol*100,'round')+'%',muteText:muted?'解除靜音':'靜音',muted});
  if(ctx){musicBus.gain.value=muted?0:musicVol;sfxBus.gain.value=muted?0:sfxVol;}
 }
 sync();
 window.LMcafeAudioSystem=Object.freeze({play,playButton,activate,setMusicVolume,setSfxVolume,toggleMute,parameters:SOUND_PARAMETERS,sampleRate:SAMPLE_RATE,baseVolume:BASE_VOLUME});
})();
